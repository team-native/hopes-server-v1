server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location /swagger-ui/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location = /swagger-ui.html {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    # 프론트에서 사용하는 짧은 경로를 실제 HTML 파일에 연결한다.
    # 이 매핑이 없으면 /chat이 index.html로 돌아가 다시 /chat을 여는 루프가 발생한다.
    location = /login {
        root /var/www/hopes-front;
        try_files /pages/login.html =404;
    }

    location = /register {
        root /var/www/hopes-front;
        try_files /pages/register.html =404;
    }

    location = /forgot-password {
        root /var/www/hopes-front;
        try_files /pages/forgot.html =404;
    }

    location = /chat {
        root /var/www/hopes-front;
        try_files /pages/chat.html =404;
    }

    location = /mypage {
        root /var/www/hopes-front;
        try_files /pages/mypage.html =404;
    }

    location = /settings {
        root /var/www/hopes-front;
        try_files /pages/settings.html =404;
    }

    location / {
        root /var/www/hopes-front;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
